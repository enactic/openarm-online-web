# TLS-terminating reverse proxy in front of the app, for WebXR testing:
# WebXR only runs in a secure context, so the VR device connects here
# over HTTPS. Generate the certificate with scripts/prepare_tls.sh.

server {
  listen 8443 ssl;
  http2 on;

  ssl_certificate /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;

  location / {
    proxy_pass http://app:8000;
    # $http_host keeps the original port so that generated URLs stay on
    # this proxy; X-Forwarded-Proto tells the app to generate https URLs
    # (trusted via FORWARDED_ALLOW_IPS in compose.yaml).
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
