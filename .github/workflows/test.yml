name: Test
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: openeval
          POSTGRES_PASSWORD: openeval
          POSTGRES_DB: openeval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openeval -d openeval_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      s3:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_ACCESS_KEY: openeval-access
          RUSTFS_SECRET_KEY: openeval-secret
          RUSTFS_UNSAFE_BYPASS_DISK_CHECK: true
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 40s
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - name: Run tests
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_USER: openeval
          POSTGRES_PASSWORD: openeval
          POSTGRES_DB: openeval_test
          PYTHONPATH: ${{ github.workspace }}
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY_ID: openeval-access
          S3_SECRET_ACCESS_KEY: openeval-secret
        working-directory: app
        run: uv run pytest tests/
