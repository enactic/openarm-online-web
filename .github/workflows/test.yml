name: Test
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: openeval
          POSTGRES_PASSWORD: openeval
          POSTGRES_DB: openeval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openeval -d openeval_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          TEST_DATABASE_URL: postgresql+psycopg://openeval:openeval@localhost:5432/openeval_test
        working-directory: app
        run: uv run pytest tests/
