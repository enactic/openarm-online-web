x-condition: &condition
  # healthcheck doesn't work in Podman in Podman because "podman wait"
  # requires systemd's timer. systemd isn't executed in Podman in Podman.
  # See also: https://github.com/podman-container-tools/podman/issues/28192
  condition: service_started
  # condition: service_healthy

services:
  app:
    build:
      context: .
      dockerfile: app/develop.Containerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      # We want to use 127.0.0.1:8000:8000 here but it doesn't work in
      # Podman in Podman. So we don't specify 127.0.0.1 here.
      - 8000:8000
    volumes:
      - ./app:/src/app
      - ./scripts:/src/scripts
      - ./config.yaml:/src/config.yaml
    environment:
      # Trust X-Forwarded-* headers from the "https" reverse proxy so
      # that generated URLs use its scheme and host.
      - FORWARDED_ALLOW_IPS=*
      - PYTHONPATH=/src
    env_file:
      - .env
    depends_on:
      db:
        <<: *condition
        restart: true
      s3:
        <<: *condition
  # TLS-terminating reverse proxy for WebXR testing, which needs HTTPS.
  # Generate the certificate first (see https/nginx.conf), then start
  # with: podman-compose --profile https up -d
  https:
    image: docker.io/library/nginx:latest
    profiles:
      - https
    ports:
      # We want to use 127.0.0.1:8443:8443 here but it doesn't work in
      # Podman in Podman. So we don't specify 127.0.0.1 here.
      - 8443:8443
    volumes:
      - ./https/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./https/server.crt:/etc/nginx/tls/server.crt:ro
      - ./https/server.key:/etc/nginx/tls/server.key:ro
    restart: unless-stopped
  db:
    image: docker.io/library/postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    userns_mode: "keep-id:uid=999,gid=999"
    volumes:
      - ./db/data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}
  s3:
    image: docker.io/rustfs/rustfs:latest
    security_opt:
      - "no-new-privileges:true"
    ports:
      # We want to use 127.0.0.1:9000:9000 here but it doesn't work in
      # Podman in Podman. So we don't specify 127.0.0.1 here.
      - 9000:9000
      - 9001:9001
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=${RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:9001}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-openarm-online-access}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-openarm-online-secret}
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - RUSTFS_UNSAFE_BYPASS_DISK_CHECK=true
    userns_mode: "keep-id:uid=10001,gid=10001"
    volumes:
      - ./storage/data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "sh", "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  runner:
    build:
      context: .
      dockerfile: e2e/runner.Containerfile
    shm_size: 512mb
    env_file:
      - .env.runner
    restart: unless-stopped
    depends_on:
      app:
        <<: *condition
