{% extends "base.html" %}
{% block title %}Tasks - {{ site_name }}{% endblock %}
{% block content %}
  <h2>Tasks</h2>
  <table border="1">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Prompt</th>
        <th>Created (UTC)</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for task in tasks %}
        <tr>
          <td>{{ task.id }}</td>
          <td>{{ task.name }}</td>
          <td>{{ task.prompt }}</td>
          <td>{{ task.created_at.strftime("%Y-%m-%d %H:%M UTC") }}</td>
          <td>
            <a href="{{ url_for('list_jobs_page').include_query_params(task_id=task.id) }}">Jobs</a>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
