{% extends "base.html" %}
{% block title %}User - {{ site_name }}{% endblock %}
{% block content %}
  <h1>Profile</h1>
  <div class="overflow-auto">
    <table>
      <tr>
        <th>GitHub login name</th>
        <td>{{ current_user.github.login_name or '-' }}</td>
      </tr>
      <tr>
        <th>Name</th>
        <td>{{ current_user.github.name or '-' }}</td>
      </tr>
    </table>
  </div>
{% endblock %}
