<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>
      {% block title %}{{ site_name }}{% endblock %}
    </title>
  </head>
  <body>
    <nav>
      <a href="{{ url_for('top_page') }}">TOP</a>
      {% if current_user %}
        <a href="{{ url_for('me_page') }}">Profile</a>
        <a href="{{ url_for('list_jobs_by_user_page', user_id=current_user.id) }}">My Jobs</a>
        <a href="{{ url_for('logout') }}">Logout</a>
      {% else %}
        <a href="{{ url_for('login_page') }}">Login</a>
      {% endif %}
    </nav>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
