<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>
      {% block title %}{{ site_name }}{% endblock %}
    </title>
  </head>
  <body>
    <nav>
      <a href="/">TOP</a>
      {% if user %}
        <a href="/me">Profile</a>
        <a href="/logout">Logout</a>
      {% else %}
        <a href="/login">Login</a>
      {% endif %}
    </nav>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
